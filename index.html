function applyUnlocks(text,options={talents:true,gear:true,achievements:true,zones:true,codex:true},catalog,now=Math.floor(Date.now()/1000)){
 let lines=text.replace(/\r/g,'').trimEnd().split('\n');if(!lines[0].startsWith('pick|'))throw Error('Load or paste a decoded save first.');
 function find(type,id){return lines.findIndex(l=>{let p=l.split('|');return p[0]===type&&(id===undefined||p[1]===String(id))})}
 function upsert(type,value,id){let i=find(type,id),line=type+'|'+(id===undefined?'':id+'|')+value;if(i<0)lines.push(line);else lines[i]=line}
 if(options.talents)for(let c of catalog.classes){let i=find('talent',c.id),old=i<0?[]:lines[i].split('|');upsert('talent',Math.max(catalog.maxTalentXP,Number(old[2])||0)+'|'+(old[3]||''),c.id)}
 if(options.gear){let i=find('items'),owned=i<0?[]:lines[i].split('|')[1].split(',').filter(Boolean).map(Number);upsert('items',[...new Set([...owned,...catalog.classes.flatMap(c=>c.items)])].sort((a,b)=>a-b).join(','))}
 if(options.achievements){let i=find('ach'),keys=new Set(i<0?[]:lines[i].split('|')[1].split(',').filter(Boolean));for(let a of catalog.achievements)keys.add(a.key);upsert('ach',[...keys].sort().join(','));let j=find('achat'),times=new Map(j<0?[]:lines[j].split('|')[1].split(',').filter(Boolean).map(x=>x.split('=')));for(let k of keys)if(!times.has(k))times.set(k,String(now));upsert('achat',[...times].sort(([a],[b])=>a.localeCompare(b)).map(([k,v])=>k+'='+v).join(','));for(let c of catalog.classes){let i=find('beat',c.id),old=i<0?[]:lines[i].split('|')[2].split(',');upsert('beat',[...new Set([...old,...catalog.zones])].filter(Boolean).join(','),c.id)} }
 if(options.zones)for(let c of catalog.classes){let i=find('unlock',c.id),old=i<0?0:Number(lines[i].split('|')[2])||0;upsert('unlock',String(Math.max(old,catalog.zones.length)),c.id)}
 if(options.codex){let i=find('seen'),seen=new Map(i<0?[]:lines[i].slice(5).split(',').filter(Boolean).map(x=>x.split('=')));for(let entry of catalog.codex)seen.set(entry.key,String(Math.max(Number(seen.get(entry.key))||0,entry.maxRank)));upsert('seen',[...seen].sort(([a],[b])=>a.localeCompare(b)).map(([k,v])=>k+'='+v).join(','))}
 return lines.join('\n')+'\n';
}

function overview(){let pick=record('pick')||[],stats=pairs('stat'),o=owned(),a=achieved(),seen=pairs('seen');return header('Your adventure',esc(pick[5]||'Welcome, adventurer'),'Your progression, gathered in one place.')+`<div class="banner"><div class="eyebrow">Your save is ready</div><h2>A world of possibilities.</h2><p>Complete the collection or make a few precise changes. Global unlocks preserve your existing talent choices and equipped gear.</p><div class="row">${button('✦ Unlock all progression','preset','data-preset="all"','gold')}<small>Gear · Codex · Achievements · Zones · Talent XP</small></div></div><div class="metrics">${metric('Class gear',CATALOG.classes.flatMap(c=>c.items).filter(i=>o.has(i)).length,415,'bag')}${metric('Codex discovered',CATALOG.codex.filter(c=>seen.has(c.key)).length,141,'book')}${metric('Achievements',CATALOG.achievements.filter(x=>a.has(x.key)).length,66,'star')}${metric('Talent points earned',CATALOG.classes.reduce((n,c)=>n+talentPoints(xp(c.id)),0),459,'shield')}</div><div class="grid2"><section class="panel"><div class="panel-top"><h3>Character & statistics</h3><span class="tag">Editable</span></div><div class="fields"><div class="field"><label for="charName">Character name</label><input id="charName" data-field="name" value="${esc(pick[5])}" maxlength="60"></div>${['gold','kills','guardians','bosses','runs','wins','caches'].map(k=>`<div class="field"><label for="stat-${k}">${pretty(k)}</label><input id="stat-${k}" data-stat="${k}" type="number" min="0" max="4294967295" value="${Number(stats.get(k)||0)}"></div>`).join('')}</div></section><section class="panel"><div class="panel-top"><h3>Choose your unlocks</h3>${icon('sword')}</div>${[['talents','Talent experience','51 earned points for each of the nine classes.'],['gear','Class gear','Every armor and weapon tier, owned and ready.'],['codex','Codex discoveries','All 141 entries at their highest discovery rank.'],['achievements','Achievements','All 66 achievements and class zone victories.'],['zones','Every zone','Open all nine zones for every class.']].map(([id,n,d])=>`<div class="quick"><div><strong>${n}</strong><p>${d}</p></div>${button('Unlock','preset',`data-preset="${id}"`,'small')}</div>`).join('')}<div class="helper">Talent XP unlocks points to spend. The game allows 51 total per class, with normal tree prerequisites.</div></section></div>`}
function searchbar(filters){return `<div class="toolbar"><div class="filters">${filters.map(([k,n])=>`<button class="small ${filter===k?'active':''}" data-filter="${k}" aria-pressed="${filter===k}">${n}</button>`).join('')}</div><input id="search" type="search" placeholder="Search entries…" aria-label="Search entries" value="${esc(search)}"></div>`}
function achievements(){let a=achieved(),list=CATALOG.achievements.filter(x=>(filter==='all'||(filter==='earned')===a.has(x.key))&&(x.name+' '+x.description).toLowerCase().includes(search.toLowerCase()));return header('Your legacy','Achievements',`${CATALOG.achievements.filter(x=>a.has(x.key)).length} of 66 earned.`,button('Unlock all achievements','preset','data-preset="achievements"','gold'))+searchbar([['all','All achievements'],['earned','Earned'],['missing','Missing']])+`<div class="achievement-list">${list.map(x=>`<article class="achievement ${a.has(x.key)?'earned':''}"><div class="medal">${icon('star')}</div><div class="content"><strong>${esc(x.name)}</strong><p>${esc(x.description)}</p><label class="row"><input type="checkbox" data-ach="${esc(x.key)}" ${a.has(x.key)?'checked':''}><small>${a.has(x.key)?'Earned':'Mark as earned'}</small></label></div></article>`).join('')}</div>${list.length?'':'<div class="empty">No achievements match this search.</div>'}`}
function collections(){let seen=pairs('seen'),list=CATALOG.codex.filter(x=>(filter==='all'||(filter==='accessories'?x.type!==2:filter==='legendary'?x.type===2:!seen.has(x.key)))&&((x.name||x.key)+' '+(CATALOG.classes.find(c=>c.id===x.classID)?.name||'')).toLowerCase().includes(search.toLowerCase()));return header('Treasures of Azeroth','Collections','Track accessories and legendary class discoveries.',button('Complete Codex','preset','data-preset="codex"','gold'))+searchbar([['all','All entries'],['accessories','Accessories'],['legendary','Class legendaries'],['missing','Undiscovered']])+`<div class="codex-grid">${list.map(x=>`<article class="codex-card ${x.type===2?'legendary':''}"><div class="row">${icon(x.type===2?'sword':'star')}<span class="eyebrow">${x.type===2?CATALOG.classes.find(c=>c.id===x.classID)?.name+' · Legendary':'Accessory'}</span></div><strong>${esc(x.name||pretty(x.key.slice(10)))}</strong><small>${seen.has(x.key)?TIERS[Number(seen.get(x.key))]+' discovered':'Not yet discovered'}</small><select aria-label="Discovery rank for ${esc(x.name||x.key)}" data-seen="${esc(x.key)}"><option value="-1" ${!seen.has(x.key)?'selected':''}>Undiscovered</option>${TIERS.map((n,i)=>`<option value="${i}" ${seen.has(x.key)&&+seen.get(x.key)===i?'selected':''}>${n} · Rank ${i}</option>`).join('')}</select></article>`).join('')}</div>${list.length?'':'<div class="empty">No entries match this search.</div>'}`}
function zones(){return header('Beyond the horizon','Zones','Zone access is tracked separately for each class.',button('Unlock every zone','preset','data-preset="zones"','gold'))+`<div class="grid2"><div class="panel"><h3>Class access</h3><p class="muted">Choose how far each class can travel.</p>${CATALOG.classes.map(c=>`<div class="list-row"><div class="class-mini" style="--class:${CLASS_STYLE[c.id][0]}"><span class="class-dot">${CLASS_STYLE[c.id][1]}</span>${c.name}</div><select data-zones="${c.id}" aria-label="Unlocked zones for ${c.name}" style="width:140px">${CATALOG.zones.map((z,i)=>`<option value="${i+1}" ${zoneCount(c.id)===i+1?'selected':''}>${i+1} / 9 zones</option>`).join('')}</select></div>`).join('')}</div><div><div class="helper">Unlocking a zone makes it selectable. Victories are recorded separately in each class’s Journey tab.</div><div class="zones">${CATALOG.zones.map((z,i)=>`<div class="zone"><div class="number">${String(i+1).padStart(2,'0')}</div><h3>${ZONE_NAMES[z]}</h3><small>${CATALOG.classes.filter(c=>zoneCount(c.id)>i).length} / 9 classes have access</small></div>`).join('')}</div></div></div>`}
function classView(c){let r=ranks(c.id),earned=talentPoints(xp(c.id)),s=spent(c.id),o=owned();return `<div style="--class:${CLASS_STYLE[c.id][0]}">`+header('Classes',`<span class="class-title"><span class="class-seal">${CLASS_STYLE[c.id][1]}</span><span>${c.name}</span></span>`,'Shape the journey. Choose your build.')+`<div class="subtabs" aria-label="${c.name} sections">${[['talents','Talents'],['gear','Gear'],['journey','Journey']].map(([id,n])=>`<button aria-pressed="${classTab===id}" class="${classTab===id?'active':''}" data-class-tab="${id}">${n}</button>`).join('')}</div>`+(classTab==='talents'?`<div class="panel"><div class="panel-top"><div><h3>${earned-s} points available <small>· ${s} spent / ${earned} earned</small></h3><small>${num(xp(c.id))} talent experience · 51-point class maximum</small></div><div class="row">${button('Max experience','class-xp','','small')}${button('Reset allocation','reset-talents','','small ghost')}</div></div><div class="progress"><span style="width:${s/51*100}%"></span></div></div><p class="helper">Use + and − to allocate ranks. Spend at most 51 points across the three trees. Earlier tiers and prerequisite talents must be trained first. Removing a prerequisite refunds dependent ranks; Undo restores them.</p><div class="tree-grid">${c.trees.map(t=>`<section class="tree"><div class="tree-head"><h3>${t.name}</h3><span class="tag">${t.talents.reduce((n,t)=>n+(r.get(t.id)||0),0)} points</span></div>${t.talents.map(t=>{let n=r.get(t.id)||0;return `<div class="talent-row ${n?'trained':''}"><div class="talent-gem"><span>${t.row+1}</span></div><div class="talent-name">${esc(t.name)}<small>Tier ${t.row+1}${t.requires?' · Requires '+esc(c.trees.flatMap(t=>t.talents).find(d=>d.id===t.requires)?.name||pretty(t.requires)):''}</small></div><div class="rank-control"><button data-rank="${t.id}" data-delta="-1" aria-label="Remove a rank from ${esc(t.name)}" ${n?'':'disabled'}>−</button><span>${n}/${t.max}</span><button data-rank="${t.id}" data-delta="1" aria-label="Add a rank to ${esc(t.name)}" ${n>=t.max||s>=earned?'disabled':''}>+</button></div></div>`}).join('')}</section>`).join('')}</div>`:classTab==='gear'?gearView(c,o):journey(c))+`</div>`}
function gearView(c,o){let eq=pairs('equip',c.id,':');return `<div class="toolbar"><div><h2>Class collection</h2><small>${c.items.filter(i=>o.has(i)).length} / ${c.items.length} armor and weapon pieces owned</small></div>${button('Unlock class gear','class-gear','','gold')}</div><div class="toolbar"><div class="filters">${TIERS.map((t,i)=>`<button class="small ${gearTier===i?'active':''}" data-tier="${i}" aria-pressed="${gearTier===i}">${t}</button>`).join('')}</div><small>Equipping also adds the item to your collection.</small></div><div class="gear-grid">${c.items.filter(id=>Math.floor(id%100/10)===gearTier).map(id=>{let slot=Math.floor(id%1000/100),equipped=Number(eq.get(String(EQUIP_SLOTS[slot])))===id;return `<article class="gear-card" style="--rarity:${RARITY[gearTier]}">${icon(slot>=8?'sword':'shield')}<strong>${esc(c.itemDetails?.find(x=>x.id===id)?.name||SLOT_NAMES[slot])}</strong><small>${SLOT_NAMES[slot]} · ${TIERS[gearTier]} · Item ${id}${equipped?' · Equipped':''}</small><div class="row"><button class="small" data-own="${id}" ${equipped?'disabled':''}>${o.has(id)?'✓ Owned':'Add to collection'}</button><button class="small ghost" data-equip="${id}" ${equipped?'disabled':''}>${equipped?'Equipped':'Equip'}</button></div></article>`}).join('')}</div>`}
function journey(c){let beaten=new Set((record('beat',c.id)?.[2]||'').split(',').filter(Boolean)),unlocked=zoneCount(c.id);return `<div class="panel"><div class="panel-top"><div><h3>${unlocked} of 9 zones open</h3><small>${beaten.size} recorded victories</small></div>${button('Open all zones','class-zones','','gold')}</div><div class="field" style="max-width:300px"><label for="classZones">Furthest unlocked zone</label><select id="classZones" data-zones="${c.id}">${CATALOG.zones.map((z,i)=>`<option value="${i+1}" ${unlocked===i+1?'selected':''}>${i+1}. ${ZONE_NAMES[z]}</option>`).join('')}</select></div></div><div class="zones">${CATALOG.zones.map((z,i)=>`<article class="zone ${i>=unlocked?'locked':''}"><div class="number">${String(i+1).padStart(2,'0')}</div><h3>${ZONE_NAMES[z]}</h3><span class="tag">${i<unlocked?'Open':'Locked'}</span><label class="row" style="margin-top:14px"><input type="checkbox" data-beat="${z}" ${beaten.has(z)?'checked':''}>Victory recorded</label></article>`).join('')}</div>`}
function advanced(){return header('For the curious','Advanced text','Edit the full decoded save. Unknown records are preserved.')+`<div class="panel"><div class="panel-top"><h3>Decoded progression</h3><div class="row"><button data-action="discard-raw" class="small ghost">Discard text edits</button><button data-action="apply-raw" class="small gold">Apply text edits</button></div></div><div class="helper">Changes here become part of the save only when you click Apply text edits. Use class panels for supported controls.</div><textarea id="raw" aria-label="Decoded save" spellcheck="false">${esc(rawDirty?rawDraft:current)}</textarea><small id="rawState">${rawDirty?'Unapplied text edits':'Synced with the editor'}</small></div>`}
function render(){const active=document.activeElement,focusId=active?.id;let focusSelector=null;if(!focusId&&active?.dataset){let keys=Object.keys(active.dataset);if(keys.length)focusSelector=keys.map(k=>"[data-"+k.replace(/[A-Z]/g,c=>"-"+c.toLowerCase())+"="+JSON.stringify(active.dataset[k])+"]").join("")}nav();$('undo').disabled=!history.length;$('download').disabled=!current;$('main').innerHTML=!current?header('Azeroth Survivors Saves Editor','Your adventure, your way.','A thoughtful toolkit for Azeroth Survivors.')+empty():view==='overview'?overview():view==='collections'?collections():view==='achievements'?achievements():view==='zones'?zones():view==='advanced'?advanced():classView(CATALOG.classes.find(c=>'class'+c.id===view));$('main').insertAdjacentHTML('beforeend','<div class="footer-note">Unofficial Azeroth Survivors editor · Built for your supplied game version · Local processing · Encrypted exports validated on download</div>');if(focusId){const el=document.getElementById(focusId);if(el)el.focus()}else if(focusSelector&&document.querySelector){document.querySelector(focusSelector)?.focus()}}
function applyPreset(kind){let opts={};if(kind==='all')for(let k of ['talents','gear','achievements','zones','codex'])opts[k]=true;else opts[kind]=true;commit(applyUnlocks(current,opts,CATALOG),'Applied '+(kind==='all'?'all progression unlocks':kind+' unlocks')+'. Export a new save when ready.')}
function writeTalent(c,r,experience=xp(c.id)){return update(current,'talent',[experience,[...r].filter(([,v])=>v>0).map(([k,v])=>k+':'+v).join(',')],c.id)}
function normalizeTalents(c,requested,budget){let out=new Map(),definitions=c.trees.flatMap((tree,treeIndex)=>tree.talents.map(t=>({...t,treeIndex}))).sort((a,b)=>a.row-b.row||a.treeIndex-b.treeIndex||a.column-b.column),used=0;
 for(let t of definitions){for(let n=0;n<Math.min(t.max,requested.get(t.id)||0);n++){
 let lower=definitions.filter(d=>d.treeIndex===t.treeIndex&&d.row<t.row).reduce((v,d)=>v+(out.get(d.id)||0),0);
 if(used>=budget||lower<t.row*5||t.requires&&!(out.get(t.requires)>0)||t.row===6&&definitions.some(d=>d.id!==t.id&&d.treeIndex===t.treeIndex&&d.row===6&&(out.get(d.id)||0)>0))break;
 out.set(t.id,(out.get(t.id)||0)+1);used++;
 }}return out}
function changeRank(c,id,delta){let t=c.trees.flatMap(t=>t.talents).find(t=>t.id===id),r=ranks(c.id),n=(r.get(id)||0)+delta,earned=talentPoints(xp(c.id));if(n<0||n>t.max||spent(c.id)+delta>earned)return;r.set(id,n);let normalized=normalizeTalents(c,r,earned);
 if(delta>0&&[...r].some(([k,v])=>v!==(normalized.get(k)||0)))throw Error('This talent needs more points in earlier tiers, its prerequisite talent, or a different capstone choice.');
 let removed=[...r].reduce((n,[k,v])=>n+Math.max(0,v-(normalized.get(k)||0)),0);commit(writeTalent(c,normalized),'Updated '+t.name+'.'+(removed?' Refunded '+removed+' dependent rank(s).':''));}
function setOwnership(id){let o=owned();o.has(id)?o.delete(id):o.add(id);commit(update(current,'items',[[...o].sort((a,b)=>a-b).join(',')]),'Gear collection updated.')}
function setAchievement(key,checked){let a=achieved(),times=pairs('achat');if(checked){a.add(key);if(!times.has(key))times.set(key,String(Math.floor(Date.now()/1000)))}else{a.delete(key);times.delete(key)}let text=update(current,'ach',[[...a].sort().join(',')]);text=update(text,'achat',[[...times].map(([k,v])=>k+'='+v).join(',')]);commit(text,'Achievement updated.')}
function showPaste(){$('pasteDialog').hidden=false;$('pasteError').textContent='';$('pasteText').focus()}
function closePaste(){$('pasteDialog').hidden=true;$('paste').focus()}
$('open').onclick=()=>$('file').click();$('paste').onclick=showPaste;$('cancelPaste').onclick=closePaste;
$('loadPaste').onclick=async()=>{try{await load($('pasteText').value,'Pasted-save');closePaste()}catch(e){$('pasteError').textContent=e.message}};
$('file').onchange=async()=>{try{let f=$('file').files[0];if(f)await load(await f.text(),f.name)}catch(e){status(e.message,true)}finally{$('file').value=''}};
$('undo').onclick=()=>{if(history.length){current=history.pop();revision++;render();status('Undid the last edit.')}};
$('download').onclick=async()=>{try{if(rawDirty)throw Error('Apply or discard your Advanced text edits before exporting.');const text=validate(current),exportRevision=revision,name=filename;status('Sealing your save and checking the round trip…');let sealed=await encode(text);if(await decode(sealed)!==text)throw Error('Round-trip validation failed.');let url=URL.createObjectURL(new Blob([sealed],{type:'text/plain'})),a=document.createElement('a');a.href=url;a.download=name+'-edited.sav';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);if(exportRevision===revision)exportedSnapshot=text;status('Exported '+name+'-edited.sav · Integrity and round-trip checks passed.'+(exportRevision!==revision?' Your latest edits remain unexported.':''))}catch(e){status(e.message,true)}};
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b||b.disabled)return;try{if(b.dataset.view){view=b.dataset.view;search='';filter='all';render();return}if(b.dataset.classTab){classTab=b.dataset.classTab;render();return}if(b.dataset.filter){filter=b.dataset.filter;render();return}if(b.dataset.tier!==undefined){gearTier=Number(b.dataset.tier);render();return}let c=CATALOG.classes.find(c=>'class'+c.id===view);if(b.dataset.rank){changeRank(c,b.dataset.rank,Number(b.dataset.delta));return}if(b.dataset.own){setOwnership(Number(b.dataset.own));return}if(b.dataset.equip){let id=Number(b.dataset.equip),slot=Math.floor(id%1000/100),eq=pairs('equip',c.id,':'),o=owned();o.add(id);eq.set(String(EQUIP_SLOTS[slot]),String(id));let text=update(current,'items',[[...o].sort((a,b)=>a-b).join(',')]);commit(update(text,'equip',[[...eq].map(([k,v])=>k+':'+v).join(',')],c.id),'Equipped '+SLOT_NAMES[slot]+'.');return}switch(b.dataset.action){case'open':$('file').click();break;case'paste':showPaste();break;case'preset':applyPreset(b.dataset.preset);break;case'class-xp':commit(writeTalent(c,ranks(c.id),Math.max(xp(c.id),23205)),c.name+' now has 51 earned talent points.');break;case'reset-talents':commit(writeTalent(c,new Map()),c.name+' talent allocation reset. Undo is available.');break;case'class-gear':{let o=owned();c.items.forEach(i=>o.add(i));commit(update(current,'items',[[...o].sort((a,b)=>a-b).join(',')]),'Unlocked all '+c.name+' gear.');break}case'class-zones':commit(update(current,'unlock',[9],c.id),'Opened all nine zones for '+c.name+'.');break;case'apply-raw':{let text=validate($('raw').value);rawDirty=false;commit(text,'Advanced text changes applied.');break}case'discard-raw':rawDirty=false;render();status('Discarded unapplied text edits.');break}}catch(err){status(err.message,true)}});
document.addEventListener('input',e=>{if(e.target.id==='raw'){rawDraft=e.target.value;rawDirty=rawDraft!==current;$('rawState').textContent=rawDirty?'Unapplied text edits':'Synced with the editor'}if(e.target.id==='search'){let pos=e.target.selectionStart;search=e.target.value;render();$('search').focus();$('search').setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{let el=e.target;try{if(el.dataset.field==='name'){let a=record('pick');a[5]=el.value.replace(/[|\r\n]/g,'');commit(update(current,'pick',a.slice(1)),'Character name updated.')}if(el.dataset.stat){let value=Number(el.value);if(!Number.isInteger(value)||value<0||value>4294967295)throw Error('Enter a whole number between 0 and 4,294,967,295.');let stats=pairs('stat');stats.set(el.dataset.stat,String(value));commit(update(current,'stat',[[...stats].map(([k,v])=>k+'='+v).join(',')]),'Statistics updated.')}if(el.dataset.ach)setAchievement(el.dataset.ach,el.checked);if(el.dataset.seen){let s=pairs('seen');Number(el.value)<0?s.delete(el.dataset.seen):s.set(el.dataset.seen,el.value);commit(update(current,'seen',[[...s].sort(([a],[b])=>a.localeCompare(b)).map(([k,v])=>k+'='+v).join(',')]),'Codex discovery updated.')}if(el.dataset.zones)commit(update(current,'unlock',[el.value],el.dataset.zones),'Zone access updated.');if(el.dataset.beat){let c=CATALOG.classes.find(c=>'class'+c.id===view),s=new Set((record('beat',c.id)?.[2]||'').split(',').filter(Boolean));el.checked?s.add(el.dataset.beat):s.delete(el.dataset.beat);commit(update(current,'beat',[[...s].join(',')],c.id),'Class victory record updated.')}}catch(err){status(err.message,true);render()}});
let dragDepth=0;document.addEventListener('dragenter',e=>{if(e.dataTransfer?.types.includes('Files')){e.preventDefault();dragDepth++;document.body.classList.add('drop-active')}});document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('dragleave',()=>{if(--dragDepth<=0)document.body.classList.remove('drop-active')});document.addEventListener('drop',async e=>{e.preventDefault();dragDepth=0;document.body.classList.remove('drop-active');try{let f=e.dataTransfer.files[0];if(f)await load(await f.text(),f.name)}catch(err){status(err.message,true)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('pasteDialog').hidden)closePaste();if(e.key==='Tab'&&!$('pasteDialog').hidden){let focus=[$('pasteText'),$('cancelPaste'),$('loadPaste')],i=focus.indexOf(document.activeElement);e.preventDefault();focus[(i+(e.shiftKey?-1:1)+focus.length)%focus.length].focus()}});
window.addEventListener('beforeunload',e=>{if((current&&current!==exportedSnapshot)||rawDirty){e.preventDefault();e.returnValue=''}});
render();

</script></body></html>
